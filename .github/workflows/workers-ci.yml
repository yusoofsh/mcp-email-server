name: Workers Free CI

on:
  push:
    branches: [main, feat/cloudflare-workers]
    paths:
      - "workers/**"
      - ".github/workflows/workers-ci.yml"
  pull_request:
    paths:
      - "workers/**"
      - ".github/workflows/workers-ci.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the configured Cloudflare account after tests pass"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Native Worker, OAuth and mail regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: OAuth, protocol, MIME and policy tests
        run: bun test tests --timeout 10000
      - name: Build and enforce compressed project budget
        run: bun run build
      - name: Validate the real Wrangler deployment bundle
        run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir .wrangler/dry-run
      - name: Exercise OAuth and MCP in workerd with KV and D1
        env:
          BUNDLE_PATH: .wrangler/dry-run/index.js
        run: bun run test:runtime
      - name: Upload public build outputs only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: email-worker-${{ github.sha }}
          path: workers/dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Explicit Cloudflare deployment
    needs: validate
    if: github.repository == 'yusoofsh/mcp-email-server' && github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Require scoped deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure repository secret CLOUDFLARE_API_TOKEN.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure repository secret CLOUDFLARE_ACCOUNT_ID.'; exit 1; }
      - run: bun install --frozen-lockfile
      - name: Deploy Worker and provision free-compatible bindings
        run: node node_modules/wrangler/bin/wrangler.js deploy
      - name: Apply auth nonce and rate-limit schema
        run: node node_modules/wrangler/bin/wrangler.js d1 migrations apply AUTH_DB --remote
      - name: Deployment configuration reminder
        run: |
          echo 'Application secrets are not stored in CI. Use workers/scripts/setup.mjs for first-time mailbox/login setup.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing Worker secrets are preserved. No mail is sent by this workflow.' >> "$GITHUB_STEP_SUMMARY"
