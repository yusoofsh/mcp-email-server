name: Upstream sync validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen
      - name: Engine and security regression tests (no live mail accounts)
        run: uv run pytest tests --ignore=tests/e2e
      - name: Strict documentation build
        if: runner.os == 'Linux'
        run: uv run mkdocs build --strict
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen --extra test
      - name: OAuth and Events regression tests in the isolated MCP 2 environment
        run: uv run pytest
