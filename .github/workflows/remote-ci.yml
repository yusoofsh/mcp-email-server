name: Remote OAuth CI and GHCR

on:
  push:
    branches: [main]
    tags: ['email-v*']
    paths:
      - 'remote/**'
      - 'mcp_email_server/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile.remote*'
      - 'deploy/**'
      - '.github/workflows/remote-ci.yml'
  pull_request:
    paths:
      - 'remote/**'
      - 'mcp_email_server/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile.remote*'
      - 'deploy/**'
      - '.github/workflows/remote-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oauth-tests:
    name: OAuth security and proxy parity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: remote/requirements-ci.txt
      - name: Install tested dependency pins
        run: |
          python -m pip install -r remote/requirements-ci.txt
          python -m pip install --no-deps -e remote
      - name: Lint and test
        working-directory: remote
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m pytest -q

  upstream-tests:
    name: Upstream email regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.29
      - name: Run upstream tests in the original locked environment
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv sync --frozen --python 3.13
          uv run --frozen python -m pytest tests --no-cov --ignore=tests/e2e

  image:
    name: Container smoke (${{ matrix.arch }})
    needs: [oauth-tests, upstream-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build native image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.remote
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: email-mcp:ci
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=email-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=email-${{ matrix.arch }}
      - name: Validate non-root container, engine and fail-closed startup
        run: |
          test "$(docker image inspect email-mcp:ci --format '{{.Config.User}}')" = '10001:10001'
          docker run --rm email-mcp:ci smoke-engine
          if docker run --rm email-mcp:ci serve; then
            echo 'ERROR: server started without credentials'
            exit 1
          fi
          printf '%s\n' 'CI-only-hash-generation-password' | docker run --rm -i email-mcp:ci hash-password --stdin | grep '^\$argon2id\$'
      - name: Log in to GHCR
        if: github.repository == 'yusoofsh/mcp-email-server' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture image
        if: github.repository == 'yusoofsh/mcp-email-server' && github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.remote
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/yusoofsh/mcp-email-server:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=email-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  publish:
    name: Publish verified multi-architecture manifest
    needs: image
    if: github.repository == 'yusoofsh/mcp-email-server' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join manifests only after both native smoke tests pass
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image=ghcr.io/yusoofsh/mcp-email-server
          tags=(-t "$image:sha-$COMMIT_SHA")
          if [ "$REF_TYPE" = 'tag' ]; then
            tags+=(-t "$image:$REF_NAME")
          elif [ "$REF_NAME" = 'main' ]; then
            tags+=(-t "$image:main" -t "$image:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:sha-$COMMIT_SHA-amd64" "$image:sha-$COMMIT_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-$COMMIT_SHA" | tee manifest.txt
          {
            echo '## Published email MCP'
            echo "Image: \`$image:sha-$COMMIT_SHA\`"
            echo '```text'
            cat manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
