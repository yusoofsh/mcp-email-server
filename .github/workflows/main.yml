name: Main

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/yusoofsh/mcp-email-server

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: make check
      - name: Capture formatting diagnostics
        if: failure()
        run: git diff --binary > quality.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: quality-diff
          path: quality.patch
          retention-days: 3

  documentation:
    name: Strict documentation build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: make docs-test

  artifacts:
    name: Exact wheel and sdist verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: make build
      - run: make verify-dist

  frontend:
    name: Frontend build and drift check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/setup-python-env
      - run: make frontend
      - run: git diff --exit-code -- frontend/embedded-assets.json mcp_email_server/web_ui/static

  browser-e2e:
    name: Real-browser management UI E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/setup-python-env
      - run: make frontend
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make test-browser

  greenmail-e2e:
    name: GreenMail E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: make test-e2e

  windows-native:
    name: Native Windows NTFS security and full runtime
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MCP_EMAIL_SERVER_REQUIRE_WINDOWS_SYMLINK_TESTS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.13"
      - name: Prepare a protected Windows test workspace
        run: |
          uv run --python 3.13 python - <<'PY'
          import os
          from pathlib import Path
          from mcp_email_server.windows_security import ensure_private_parent
          container = Path(os.environ["RUNNER_TEMP"]) / "mcp-email-server-tests"
          ensure_private_parent(container / "placeholder")
          values = {
              "MCP_EMAIL_SERVER_CONFIG_PATH": (container / "config.toml").as_posix(),
              "MCP_EMAIL_SERVER_WINDOWS_PYTEST_ROOT": (container / "pytest").as_posix(),
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              for key, value in values.items():
                  environment.write(f"{key}={value}\n")
          PY
      - name: Run the full Python suite on Windows
        run: >-
          uv run --python 3.13 python -m pytest --no-cov
          --basetemp "$MCP_EMAIL_SERVER_WINDOWS_PYTEST_ROOT" tests
      - name: Re-run native NTFS security cases
        run: >-
          uv run --python 3.13 python -m pytest --no-cov -vv
          --basetemp "$MCP_EMAIL_SERVER_WINDOWS_PYTEST_ROOT" tests/test_windows_security.py
      - run: uv run --python 3.13 python -m pyright

  tests-and-type-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml
      - if: matrix.python-version == '3.13'
        run: uv run --python 3.13 python -m pyright

  oauth-tests:
    name: OAuth security and release safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: remote/requirements-ci.txt
      - run: |
          python -m pip install -r remote/requirements-ci.txt
          python -m pip install --no-deps -e remote
      - working-directory: remote
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m pytest -q

  image:
    name: Exact OAuth image (${{ matrix.arch }})
    needs: oauth-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.repository == 'yusoofsh/mcp-email-server' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build untagged candidate once
        id: candidate
        if: github.repository == 'yusoofsh/mcp-email-server' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=oauth-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=oauth-${{ matrix.arch }}
      - name: Build local candidate for pull requests or forks
        if: github.repository != 'yusoofsh/mcp-email-server' || github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: email-mcp:test
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=oauth-${{ matrix.arch }}
      - name: Verify the exact image with canonical Compose
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -n "$CANDIDATE_DIGEST" ]; then
            ref="$IMAGE@$CANDIDATE_DIGEST"
            docker pull "$ref"
            report="evidence/$ARCH.json"
          else
            ref=email-mcp:test
            report=""
          fi
          args=(--image "$ref" --source-sha "$SOURCE_SHA")
          if [ -n "$report" ]; then args+=(--report "$report"); fi
          python3 remote/scripts/verify_container.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.candidate.outputs.digest != ''
        with:
          name: verified-${{ matrix.arch }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Promote verified latest
    needs: [quality, documentation, artifacts, frontend, browser-e2e, greenmail-e2e, windows-native, tests-and-type-check, oauth-tests, image]
    if: github.repository == 'yusoofsh/mcp-email-server' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: email-mcp-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: verified-*
          path: evidence
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject stale commits and promote only tested digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 remote/scripts/promote_image.py --evidence evidence --source-sha "$SOURCE_SHA"
