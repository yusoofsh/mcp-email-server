services:
  email-mcp:
    image: ${MCP_IMAGE:-ghcr.io/yusoofsh/mcp-email-server:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9557:9557"
    environment:
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?Set the HTTPS public origin}
      MCP_AUTH_USERNAME: ${MCP_AUTH_USERNAME:?Set a login username}
      MCP_AUTH_REDIRECT_URIS: ${MCP_AUTH_REDIRECT_URIS:?Set exact OAuth callback URLs}
      MCP_AUTH_PASSWORD_HASH_FILE: /run/secrets/mcp_password_hash
    secrets:
      - mcp_password_hash
    volumes:
      - email_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

secrets:
  mcp_password_hash:
    file: ./secrets/mcp-password.hash

volumes:
  email_data:
