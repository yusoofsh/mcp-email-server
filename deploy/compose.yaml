name: email
services:
  proxy:
    image: ghcr.io/yusoofsh/mcp-email-server:latest
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - ${MCP_ENV_FILE:-.env}
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "9557"
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?Set the HTTPS public origin}
      MCP_AUTH_USERNAME: ${MCP_AUTH_USERNAME:?Set a login username}
      MCP_AUTH_REDIRECT_URIS: ${MCP_AUTH_REDIRECT_URIS:-*}
      MCP_AUTH_PASSWORD_HASH: ${MCP_AUTH_PASSWORD_HASH:?Set the Argon2 password hash}
    volumes:
      - data:/data
    ports:
      - "${MCP_BIND_ADDRESS:-172.19.0.1}:${MCP_BIND_PORT:-9557}:9557"
    labels:
      caddy: email.yusoofsh.id
      caddy.reverse_proxy: "172.19.0.1:9557"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

volumes:
  data:
    external: true
    name: email-oauth_data
