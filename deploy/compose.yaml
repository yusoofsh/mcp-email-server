name: email
services:
  proxy:
    image: ghcr.io/yusoofsh/mcp-email-server@sha256:7740013f935cd2c0d5a7a440acb327718e0a60582d64f55eb2121f2adf968bce
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "9557"
    volumes:
      - data:/data
    ports:
      - "172.19.0.1:9557:9557"
    labels:
      caddy: email.yusoofsh.id
      caddy.reverse_proxy: "172.19.0.1:9557"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

volumes:
  data:
    external: true
    name: email-oauth_data
