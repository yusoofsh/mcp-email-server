# Combine with /opt/stacks/email/compose.yaml from the stack directory.
# The standard image uses the existing Caddy Bearer gate and .env account
# settings; pull the selected image before updating the app service.
services:
  app:
    image: ${MCP_EMAIL_IMAGE:-ghcr.io/yusoofsh/mcp-email-server:standard}
    pull_policy: always
    command: ["streamable-http"]
    user: "1003:1003"
    environment:
      HOME: /config

networks:
  email:
    external: true
    name: email
