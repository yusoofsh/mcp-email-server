[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "email-mcp-remote"
version = "0.1.0"
description = "Single-operator FastMCP OAuth front end for the Wh1isper email engine"
requires-python = ">=3.13,<3.14"
license = "BSD-3-Clause"
dependencies = [
  "fastmcp==4.0.5",
  "mcp==2.2.0",
  "argon2-cffi==25.1.0",
  "cryptography>=50.0.1",
  "uvicorn>=0.35,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
email-mcp-remote = "email_mcp_remote.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_mcp_remote"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
